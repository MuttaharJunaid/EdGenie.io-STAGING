[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgenie"
version = "0.1.0"
description = "AI-powered past paper analysis platform for O/A level CAIE students"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}

dependencies = [
    # HTTP & Scraping
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",

    # CLI
    "typer[all]>=0.12",
    "rich>=13.0",

    # Data validation
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Utilities
    "tenacity>=9.0",

    # PDF & Data processing (Stage 2)
    "pymupdf>=1.24.0",
    "pandas>=2.0.0",

    # AI & Agents (Stage 2 & Orchestrator)
    "langchain>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    "langchain-google-genai>=0.1.0",

    # Image processing (Stage 3)
    "Pillow>=10.0",
    "cairosvg>=2.7",

    # Browser automation (Stage 3 — visual extraction)
    "playwright>=1.45",

    # Database & Cloud Storage (Stage 4 — Ingestion & Assets)
    "pymongo>=4.6",
    "firebase-admin>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]


[project.scripts]
edgenie-scraper = "pipeline.scraper.cli:app"
edgenie-extractor = "pipeline.extractor.cli:app"
edgenie-visuals = "pipeline.visuals.cli:app"
edgenie-ingestor = "pipeline.ingestion.cli:app"
edgenie-syllabus = "pipeline.syllabus.cli:app"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
