[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edgenie"
version = "0.1.0"
description = "AI-powered past paper analysis platform for O/A level CAIE students"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}

dependencies = [
    # HTTP & Scraping (Stage 1)
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",

    # CLI
    "typer[all]>=0.12",
    "rich>=13.0",

    # Data validation & Settings
    "pydantic>=2.0",
    "pydantic-settings>=2.0",

    # Utilities
    "tenacity>=9.0",

    # PDF Processing (PyMuPDF)
    "pymupdf>=1.24.0",

    # Unified 3-in-1 Pipeline (Stage 2: Unstructured.io Transform API)
    "unstructured-transform-client>=0.18.0",

    # Database & Cloud Storage (Stage 3 — Ingestion & CDN Hosting)
    "psycopg[binary]>=3.1",
    "firebase-admin>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]


[project.scripts]
edgenie-scraper = "pipeline.scraper.cli:app"
edgenie-unified = "pipeline.unified.cli:app"
edgenie-extractor = "pipeline.unified.cli:app"
edgenie-ingestor = "pipeline.ingestion.cli:app"


[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "firebase_admin.*",
    "unstructured_transform_client.*",
]
ignore_missing_imports = true

